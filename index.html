<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helyi Adatlap (Mentéssel)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-top: 0;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .counter-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-reset { background-color: #dc3545; color: white; margin-top: 20px; width: 100%; }
        .btn-reset:hover { background-color: #a71d2a; }
        .status-bar {
            font-size: 13px;
            color: #28a745;
            margin-top: 15px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Adatlap (Helyi mentéssel)</h2>

    <!-- 1. Kérdés: Szöveges mező -->
    <div class="form-group">
        <label for="inputName">Név / Megjegyzés:</label>
        <input type="text" id="inputName" placeholder="Írj be valamit...">
    </div>

    <!-- 2. Kérdés: Számláló gombokkal -->
    <div class="form-group">
        <label>Számláló értéke:</label>
        <div class="counter-container">
            <button class="btn btn-primary" onclick="changeCounter(-1)">-</button>
            <span id="counterValue" style="font-size: 22px; font-weight: bold;">0</span>
            <button class="btn btn-primary" onclick="changeCounter(1)">+</button>
        </div>
    </div>

    <!-- 3. Kérdés: Lenyíló opció -->
    <div class="form-group">
        <label for="selectStatus">Státusz kiválasztása:</label>
        <select id="selectStatus">
            <option value="Függőben">Függőben</option>
            <option value="Folyamatban">Folyamatban</option>
            <option value="Kész">Kész</option>
        </select>
    </div>

    <!-- Reset gomb -->
    <button class="btn btn-reset" onclick="resetAllData()">Törlés / Reset</button>

    <div class="status-bar">Automatikus helyi mentés aktív ✓</div>
</div>

<script>
    // Alapértelmezett adatok
    const defaultData = {
        name: "",
        counter: 0,
        status: "Függőben"
    };

    let appData = { ...defaultData };

    // DOM elemek
    const inputName = document.getElementById("inputName");
    const counterValue = document.getElementById("counterValue");
    const selectStatus = document.getElementById("selectStatus");

    // 1. Adatok betöltése megnyitáskor a böngésző memóriájából
    function loadData() {
        const saved = localStorage.getItem("my_simple_app_data");
        if (saved) {
            try {
                appData = JSON.parse(saved);
            } catch (e) {
                console.error("Hiba az adatok betöltésekor:", e);
            }
        }
        updateUI();
    }

    // 2. Adatok elmentése a böngésző memóriájába
    function saveData() {
        localStorage.setItem("my_simple_app_data", JSON.stringify(appData));
    }

    // 3. Felület frissítése az adatok alapján
    function updateUI() {
        inputName.value = appData.name || "";
        counterValue.innerText = appData.counter || 0;
        selectStatus.value = appData.status || "Függőben";
    }

    // 4. Eseménykezelők (amikor változtatsz valamit, azonnal ment)
    inputName.addEventListener("input", (e) => {
        appData.name = e.target.value;
        saveData();
    });

    selectStatus.addEventListener("change", (e) => {
        appData.status = e.target.value;
        saveData();
    });

    function changeCounter(delta) {
        appData.counter = (appData.counter || 0) + delta;
        counterValue.innerText = appData.counter;
        saveData();
    }

    // RESET gomb: Töröl mindent
    function resetAllData() {
        if (confirm("Biztosan törölni szeretnéd az összes elmentett adatot?")) {
            appData = { ...defaultData };
            localStorage.removeItem("my_simple_app_data");
            updateUI();
        }
    }

    // Indításkor adatok betöltése
    loadData();
</script>

</body>
</html>
